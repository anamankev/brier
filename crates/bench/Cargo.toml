[package]
name = "brier-bench"
description = "Registered benchmarks: engine P1/P2 (docs/notes/performance.md), gateway P3/P3b/P4 (docs/notes/gateway.md)"
version = "1.0.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "brier-bench"
path = "src/main.rs"

[[bin]]
name = "brier-gateway-bench"
path = "src/gateway.rs"

[dependencies]
brier-engine = { path = "../engine" }
brier-types = { path = "../types" }
axum = "=0.8.9"
brier-core = { path = "../core" }
brier-gateway = { path = "../gateway" }
brier-readmodel = { path = "../readmodel" }
futures-util = "=0.3.34"
hdrhistogram = { version = "7.5", default-features = false }
serde_json = "1.0"
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util"] }
tokio-postgres = "0.7.18"
tokio-tungstenite = "=0.29.0"

[lints]
workspace = true
