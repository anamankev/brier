[package]
name = "brier-replay"
description = "Replay wire-format commands (JSON lines) through the engine and print events (docs/protocol.md)"
version = "1.0.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "brier-replay"
path = "src/main.rs"

[dependencies]
brier-engine = { path = "../engine" }
brier-types = { path = "../types" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[lints]
workspace = true
