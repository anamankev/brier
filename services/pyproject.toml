[project]
name = "brier-services"
version = "1.0.0"
description = "Exchange services and research: reference engine, resolvers, market maker, surveillance, simulation"
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=9.2,<10",
    "hypothesis>=6.170,<7",
    "ruff>=0.17,<0.18", # minor pinned: Ruff adds and changes rules between minor versions
    "mypy>=2.4,<3",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# BLE and E722 enforce "no bare or broad except"; S covers common security mistakes.
select = ["E", "F", "W", "I", "B", "BLE", "UP", "SIM", "C4", "RUF", "PT", "PERF", "PIE", "RET", "S", "ANN", "FBT"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"] # assert is how pytest checks

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "slow: longer than a few seconds; excluded from make check",
]
