# Every push and pull request: the same checks as `make check`, split by toolchain.
# Actions are pinned to commit SHAs (resolved 2026-11-01, same pins as twofold); Dependabot
# proposes updates. Rust needs no setup action: the runner's rustup installs the toolchain
# pinned in rust-toolchain.toml on first use.
name: check

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup show active-toolchain || rustup toolchain install
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  integration:
    # Tests that need PostgreSQL: read models equal a rebuild from the journal; the REST and
    # WebSocket APIs end to end; the Python reference client against a real gateway process.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16.15-alpine@sha256:0cefaabd882e42bcb2a2f3dc56d3ce4770560ba62fd7f197f1a2e008fd5731ab
        env:
          POSTGRES_USER: brier
          POSTGRES_PASSWORD: ci-only-not-secret
          POSTGRES_DB: brier
        ports:
          - 55442:5432
        options: >-
          --health-cmd "pg_isready -U brier -d brier" --health-interval 2s --health-timeout 3s
          --health-retries 30
    env:
      BRIER_TEST_DATABASE_URL: postgres://brier:ci-only-not-secret@127.0.0.1:55442/brier
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup show active-toolchain || rustup toolchain install
      - run: cargo test --workspace --locked -- --ignored
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
          working-directory: services
          enable-cache: true
      - run: uv sync --locked
        working-directory: services
      - run: uv run --locked pytest -q -m integration
        working-directory: services

  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
          working-directory: services
          enable-cache: true
      - run: uv sync --locked
      - run: uv run --locked ruff format --check .
      - run: uv run --locked ruff check .
      - run: uv run --locked mypy
      - run: uv run --locked pytest -q -m "not differential"

  differential:
    # The Rust engine against the Python reference engine on seeded random streams (SPEC §3.4).
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: services
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
          working-directory: services
          enable-cache: true
      - run: uv sync --locked
      - run: uv run --locked pytest -q -m differential

  private-tooling:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sh scripts/private_tooling_check.sh
