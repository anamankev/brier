# Secret scanning over the full history, and known-vulnerability audits of the locked
# dependencies. Runs on every push and pull request, and weekly so new advisories surface
# even when nothing changes.
name: security

on:
  push:
  pull_request:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the whole history, not just the latest commit
      - name: Install gitleaks 8.30.1 (checksum verified)
        run: |
          curl -fsSLo gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" \
            | sha256sum --check
          tar -xzf gitleaks.tar.gz gitleaks
      - run: ./gitleaks git --redact --no-banner --verbose .

  rust-dependencies:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: cargo install cargo-audit --version 0.22.2 --locked
      - run: cargo audit --deny warnings

  python-dependencies:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
          working-directory: services
      - name: Audit every locked package, including development tools
        run: |
          uv export --locked --all-groups --no-emit-project --format requirements-txt > requirements.txt
          uvx --from pip-audit==2.10.1 pip-audit --strict --requirement requirements.txt
