# Fuzz targets (docs/gates/G4-plan.md). Built with the pinned nightly toolchain:
#   cargo +nightly-2026-10-20 fuzz run <target> -- -max_total_time=3600
# A separate workspace, so the main build never needs nightly or libFuzzer.
[package]
name = "brier-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[workspace]
members = ["."]

[dependencies]
libfuzzer-sys = "=0.4.13"
brier-engine = { path = "../crates/engine" }
brier-gateway = { path = "../crates/gateway" }
brier-types = { path = "../crates/types" }
ed25519-dalek = "=3.0.0"
http = "=1.5.0"
serde_json = "=1.0.154"
brier-journal = { path = "../crates/journal" }
brier-wire = { path = "../crates/wire" }
tempfile = "3.27"

[[bin]]
name = "wire_parse"
path = "fuzz_targets/wire_parse.rs"
test = false
doc = false

[[bin]]
name = "journal_decode"
path = "fuzz_targets/journal_decode.rs"
test = false
doc = false

[[bin]]
name = "journal_recover"
path = "fuzz_targets/journal_recover.rs"
test = false
doc = false

[[bin]]
name = "snapshot_restore"
path = "fuzz_targets/snapshot_restore.rs"
test = false
doc = false

[[bin]]
name = "gateway_request"
path = "fuzz_targets/gateway_request.rs"
test = false
doc = false

[[bin]]
name = "signature_verify"
path = "fuzz_targets/signature_verify.rs"
test = false
doc = false
