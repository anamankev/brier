asyncapi: 3.0.0
info:
  title: Brier exchange WebSocket API
  version: 1.0.0
  description: |
    One WebSocket at `/v1/ws` carries market data and order entry (SPEC §6). Every frame is a
    UTF-8 JSON object in a text frame; a binary frame closes the connection (1003).

    Client messages have an `op` and an optional `id` (any JSON value), echoed in the
    `reply`. Order replies arrive once the command is durable, possibly in a different order
    from the requests; the `id` pairs them. Each client message counts against the per-address
    limit (500 per second, burst 1,000); orders also count against the account's (200 per
    second, burst 400). At most 64 subscriptions and 256 orders awaiting durability per
    connection; messages are at most 8 KiB.

    Sequencing. Every channel message carries `seq`, that channel's sequence number,
    `journal_seq`, the journal sequence number it reflects, and `ts`, when the server
    published it (microseconds since the Unix epoch). The first message of a
    subscription (a book `snapshot`, or `subscribed`) states the current `seq`; each later
    message has the previous `seq` plus one. A client that sees anything else has missed
    messages. A subscriber that falls behind (more than 1,024 messages) is resubscribed by the
    server: on a book channel it receives a fresh `snapshot`, which replaces its book; on other
    channels a fresh `subscribed`, after which it re-reads state over REST (`/v1/portfolio`,
    `/v1/fills`, `/v1/markets/{id}/trades`), discarding channel messages whose `journal_seq` is
    at or below the REST answer's `as_of`. The reference client
    (`services/src/brier_services/client.py`) implements this and is tested against dropped,
    duplicated, and reordered messages.

    When the exchange shuts down it closes connections with 1001 (going away).
defaultContentType: application/json
servers:
  local:
    host: 127.0.0.1:8080
    protocol: ws
    description: Local development
channels:
  ws:
    address: /v1/ws
    messages:
      auth: { $ref: '#/components/messages/auth' }
      subscribe: { $ref: '#/components/messages/subscribe' }
      unsubscribe: { $ref: '#/components/messages/unsubscribe' }
      place: { $ref: '#/components/messages/place' }
      cancel: { $ref: '#/components/messages/cancel' }
      amend: { $ref: '#/components/messages/amend' }
      ping: { $ref: '#/components/messages/ping' }
      reply: { $ref: '#/components/messages/reply' }
      snapshot: { $ref: '#/components/messages/snapshot' }
      delta: { $ref: '#/components/messages/delta' }
      trade: { $ref: '#/components/messages/trade' }
      subscribed: { $ref: '#/components/messages/subscribed' }
      resync: { $ref: '#/components/messages/resync' }
      order: { $ref: '#/components/messages/order' }
      fill: { $ref: '#/components/messages/fill' }
operations:
  sendCommands:
    action: receive
    channel: { $ref: '#/channels/ws' }
    summary: Messages the client sends
    messages:
      - { $ref: '#/channels/ws/messages/auth' }
      - { $ref: '#/channels/ws/messages/subscribe' }
      - { $ref: '#/channels/ws/messages/unsubscribe' }
      - { $ref: '#/channels/ws/messages/place' }
      - { $ref: '#/channels/ws/messages/cancel' }
      - { $ref: '#/channels/ws/messages/amend' }
      - { $ref: '#/channels/ws/messages/ping' }
  receiveEvents:
    action: send
    channel: { $ref: '#/channels/ws' }
    summary: Messages the server sends
    messages:
      - { $ref: '#/channels/ws/messages/reply' }
      - { $ref: '#/channels/ws/messages/snapshot' }
      - { $ref: '#/channels/ws/messages/delta' }
      - { $ref: '#/channels/ws/messages/trade' }
      - { $ref: '#/channels/ws/messages/subscribed' }
      - { $ref: '#/channels/ws/messages/resync' }
      - { $ref: '#/channels/ws/messages/order' }
      - { $ref: '#/channels/ws/messages/fill' }
components:
  messages:
    auth:
      summary: Authenticate the connection, with a session token or a signed request
      description: |
        A signature is over a `GET /v1/ws` request with an empty body, exactly as for REST
        (openapi.yaml, `signed`), and is accepted once.
      payload:
        type: object
        required: [op]
        properties:
          op: { const: auth }
          id: {}
          token: { type: string }
          key: { type: integer }
          timestamp: { type: integer }
          signature: { type: string }
    subscribe:
      summary: Subscribe to a channel
      payload:
        type: object
        required: [op, channel]
        properties:
          op: { const: subscribe }
          id: {}
          channel: { $ref: '#/components/schemas/Channel' }
    unsubscribe:
      summary: Stop a subscription
      payload:
        type: object
        required: [op, channel]
        properties:
          op: { const: unsubscribe }
          id: {}
          channel: { $ref: '#/components/schemas/Channel' }
    place:
      summary: Place an order (fields as the REST NewOrder body); needs auth
      payload:
        type: object
        required: [op, market, side, price, qty]
        properties:
          op: { const: place }
          id: {}
          market: { type: integer }
          side: { enum: [buy, sell] }
          price: { type: integer }
          qty: { type: integer }
          tif: { enum: [gtc, ioc, fok] }
          post_only: { type: boolean }
          client_order_id: { type: integer }
    cancel:
      summary: Cancel a resting order; needs auth
      payload:
        type: object
        required: [op, order]
        properties:
          op: { const: cancel }
          id: {}
          order: { type: integer }
    amend:
      summary: Reduce a resting order's quantity; needs auth
      payload:
        type: object
        required: [op, order, qty]
        properties:
          op: { const: amend }
          id: {}
          order: { type: integer }
          qty: { type: integer }
    ping:
      summary: Liveness check; answered with a reply whose result is {"pong":true}
      payload:
        type: object
        required: [op]
        properties:
          op: { const: ping }
          id: {}
    reply:
      summary: The answer to a client message
      description: |
        `result` has the same shape as the REST answer to the same command (openapi.yaml);
        `error` is the REST error object, including `seq` for an engine rejection.
      payload:
        type: object
        required: [type, id, ok]
        properties:
          type: { const: reply }
          id: {}
          ok: { type: boolean }
          result: { type: object }
          error:
            type: object
            required: [code, message]
            properties:
              code: { type: string }
              message: { type: string }
              seq: { type: integer }
    snapshot:
      summary: The whole book of a market (first message of a book subscription, or a resync)
      payload:
        type: object
        required: [type, channel, seq, journal_seq, ts, state, bids, asks]
        properties:
          type: { const: snapshot }
          channel: { type: string, examples: ['book:1'] }
          seq: { type: integer }
          journal_seq: { type: integer }
          ts: { type: integer, description: Publish time, microseconds since the Unix epoch }
          state: { $ref: '#/components/schemas/MarketState' }
          bids: { $ref: '#/components/schemas/Levels' }
          asks: { $ref: '#/components/schemas/Levels' }
    delta:
      summary: The levels one command changed, with their new totals (0 means the level is gone)
      payload:
        type: object
        required: [type, channel, seq, journal_seq, ts, state, bids, asks]
        properties:
          type: { const: delta }
          channel: { type: string }
          seq: { type: integer }
          journal_seq: { type: integer }
          ts: { type: integer, description: Publish time, microseconds since the Unix epoch }
          state: { $ref: '#/components/schemas/MarketState' }
          bids: { $ref: '#/components/schemas/Levels' }
          asks: { $ref: '#/components/schemas/Levels' }
    trade:
      summary: An execution (trades channel; no account identities)
      payload:
        type: object
        required: [type, channel, seq, journal_seq, ts, price, qty, taker_side]
        properties:
          type: { const: trade }
          channel: { type: string, examples: ['trades:1'] }
          seq: { type: integer }
          journal_seq: { type: integer }
          ts: { type: integer, description: Publish time, microseconds since the Unix epoch }
          price: { type: integer }
          qty: { type: integer }
          taker_side: { enum: [buy, sell] }
    subscribed:
      summary: First message of a trades or account subscription, with the current seq
      payload:
        type: object
        required: [type, channel, seq, journal_seq, ts]
        properties:
          type: { const: subscribed }
          channel: { type: string }
          seq: { type: integer }
          journal_seq: { type: integer }
          ts: { type: integer, description: Publish time, microseconds since the Unix epoch }
    resync:
      summary: The server rebuilt its state; messages before this one may be missing
      payload:
        type: object
        required: [type, channel, seq, journal_seq, ts]
        properties:
          type: { const: resync }
          channel: { type: string }
          seq: { type: integer }
          journal_seq: { type: integer }
          ts: { type: integer, description: Publish time, microseconds since the Unix epoch }
    order:
      summary: One of the subscriber's order events (account channel)
      payload:
        type: object
        required: [type, channel, seq, journal_seq, ts, event]
        properties:
          type: { const: order }
          channel: { const: account }
          seq: { type: integer }
          journal_seq: { type: integer }
          ts: { type: integer, description: Publish time, microseconds since the Unix epoch }
          event: { enum: [accepted, rested, cancelled, amended, duplicate, rejected] }
          order: { type: [integer, 'null'] }
          market: { type: integer, description: accepted only }
          side: { enum: [buy, sell], description: accepted only }
          price: { type: integer, description: accepted only }
          qty: { type: integer, description: accepted only }
          client_order_id: { type: [integer, 'null'], description: accepted and duplicate }
          remaining: { type: integer, description: rested, cancelled, amended }
          reason: { type: string, description: cancelled (cancel reason) and rejected (reject reason) }
          command: { enum: [place, cancel, amend], description: rejected only }
    fill:
      summary: An execution of one of the subscriber's orders (account channel)
      payload:
        type: object
        required: [type, channel, seq, journal_seq, ts, order, market, side, price, qty, liquidity]
        properties:
          type: { const: fill }
          channel: { const: account }
          seq: { type: integer }
          journal_seq: { type: integer }
          ts: { type: integer, description: Publish time, microseconds since the Unix epoch }
          order: { type: integer }
          market: { type: integer }
          side: { enum: [buy, sell] }
          price: { type: integer }
          qty: { type: integer }
          liquidity: { enum: [maker, taker] }
  schemas:
    Channel:
      type: string
      pattern: '^(book:[0-9]+|trades:[0-9]+|account)$'
      description: '`account` needs auth and names the caller''s own account'
    MarketState:
      enum: [pre_open, open, halted, closed, resolved, voided]
    Levels:
      type: array
      description: '[price, quantity] pairs; in a snapshot best price first'
      items:
        type: array
        minItems: 2
        maxItems: 2
        items: { type: integer }
