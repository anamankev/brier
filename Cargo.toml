[workspace]
resolver = "3"
members = ["crates/types", "crates/engine", "crates/replay", "crates/bench"]

[workspace.package]
edition = "2024"
rust-version = "1.99"
publish = false

[workspace.dependencies]
proptest = "1.12"

# Lints shared by every crate. Library code may not panic, unwrap, use floating point, or do
# unchecked integer arithmetic: money and prices are integers with explicit overflow handling
# (SPEC §2.1 and the integer-money rule). Tests are exempted in clippy.toml.
[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
float_arithmetic = "deny"
arithmetic_side_effects = "deny"
indexing_slicing = "deny"

[profile.release]
debug = 1          # line tables for profiling the engine (SPEC §11)
codegen-units = 1
lto = "thin"

# Property tests run hundreds of random streams with full invariant checks after every
# command. Optimize test builds so `make check` stays fast; overflow checks and debug
# assertions stay on, as in any test build.
[profile.test]
opt-level = 2
overflow-checks = true
debug-assertions = true
