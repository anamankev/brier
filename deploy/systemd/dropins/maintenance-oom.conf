# Installed for apt-daily, apt-daily-upgrade and packagekit as <unit>.d/10-brier-oom.conf.
# Package maintenance is what pushed the 1 GB server out of memory on Nov 19 2026. If memory
# runs out again, the OOM killer should pick these jobs, which simply run again tomorrow,
# rather than Postgres or the gateway.
[Service]
OOMScoreAdjust=800
