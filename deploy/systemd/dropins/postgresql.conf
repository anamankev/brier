# Installed as /etc/systemd/system/postgresql@16-main.service.d/10-brier.conf.
# On Nov 19 2026 the kernel OOM killer hit a Postgres backend; systemd then stopped the
# whole cluster (result oom-kill) and nothing started it again, so the exchange was down
# for two days. Restart on any failure, without a start limit.
[Unit]
StartLimitIntervalSec=0

[Service]
Restart=on-failure
RestartSec=5s
